:root{
  --copper:#C2570F;
  --copper-deep:#A34708;
  --terminal-green:#7BE3A0;
  --serif:'Fraunces',serif;

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--sans);min-height:100svh;display:flex;flex-direction:column;
  color:#FFF8EC;line-height:1.6;font-size:17px;
  background:
    radial-gradient(circle at 50% 10%, rgba(123,227,160,.2), transparent 30%),
    linear-gradient(180deg,#07100B 0%,#0D1B13 60%,#16291E 100%);
}
header{border-bottom:1px solid rgba(244,239,228,.12);padding:18px 0}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px;width:100%}
.wordmark{font-family:var(--mono);font-weight:500;letter-spacing:.18em;font-size:14px;text-transform:uppercase;color:#FFF8EC;text-decoration:none}
.wordmark span{color:var(--copper)}
main{flex:1;display:grid;place-items:center;text-align:center;padding:64px 0}
.code{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--terminal-green);margin-bottom:20px;animation:rise .7s ease both}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(40px,6.4vw,76px);line-height:1.02;letter-spacing:-.015em;max-width:14ch;margin:0 auto;animation:rise .7s .08s ease both}
h1 em{font-style:italic;font-weight:600;color:var(--terminal-green)}
p.lede{font-size:19px;color:#C6D5CB;max-width:44ch;margin:22px auto 32px;animation:rise .7s .16s ease both}
.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;animation:rise .7s .24s ease both}
.btn{
  display:inline-block;text-decoration:none;font-weight:700;font-size:16px;
  padding:15px 28px;border-radius:999px;transition:transform .15s,background .2s;
}
.btn-primary{background:#FFF8EC;color:#07100B}
.btn-primary:hover{background:var(--terminal-green)}
.btn-ghost{color:#FFF8EC;border:1px solid rgba(244,239,228,.24);background:rgba(244,239,228,.05)}
.btn-ghost:hover{border-color:var(--terminal-green);color:var(--terminal-green)}
footer{border-top:1px solid rgba(244,239,228,.12);padding:28px 0;font-family:var(--mono);font-size:13px;color:#8FA896}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
